display_builder.profile.*:
  type: config_entity
  label: Display builder profile
  mapping:
    id:
      type: machine_name
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: uuid
    description:
      type: text
    islands:
      type: sequence
      label: 'Islands'
      sequence:
        type: display_builder.islands.[%key]
    library_flat:
      type: boolean
      label: 'Flatten library panels'
    library_tabs_display:
      type: display_builder.panels_display
      label: 'Show library tabs as'
    contextual_tabs_display:
      type: display_builder.panels_display
      label: 'Show contextual tabs as'
    view_panels_display:
      type: display_builder.panels_display
      label: 'Show View panels as'
    weight:
      type: weight
      label: Weight

display_builder.islands:
  type: mapping
  label: 'Island configuration'
  mapping:
    status:
      type: boolean
      label: Enabled
    weight:
      type: weight
      label: Weight

display_builder.islands.*:
  type: display_builder.islands

display_builder.islands.state:
  type: display_builder.islands
  mapping:
    publish:
      type: display_builder.toolbar.button
    restore:
      type: display_builder.toolbar.button
    revert:
      type: display_builder.toolbar.button

display_builder.islands.history:
  type: display_builder.islands
  mapping:
    undo:
      type: display_builder.toolbar.button
    redo:
      type: display_builder.toolbar.button

display_builder.islands.controls:
  type: display_builder.islands
  mapping:
    highlight:
      type: display_builder.toolbar.button
    expand:
      type: display_builder.toolbar.button
    theme:
      type: display_builder.toolbar.button
    help:
      type: display_builder.toolbar.button

display_builder.islands.component_library:
  type: display_builder.islands
  mapping:
    exclude:
      type: sequence
      sequence:
        type: string
    exclude_id:
      type: string
    component_status:
      type: sequence
      sequence:
        type: string
    include_no_ui:
      type: boolean
    show:
      type: string
    preview:
      type: boolean
    show_grouped:
      type: boolean
      deprecated: "The 'show_grouped' config schema is deprecated in display_builder:1.0.0-beta5 and is removed from display_builder:1.0.0-rc1. Use the 'show' config schema instead."
    show_variants:
      type: boolean
      deprecated: "The 'show_variants' config schema is deprecated in display_builder:1.0.0-beta5 and is removed from display_builder:1.0.0-rc1. Use the 'show' config schema instead."
    show_mosaic:
      type: boolean
      deprecated: "The 'show_mosaic' config schema is deprecated in display_builder:1.0.0-beta5 and is removed from display_builder:1.0.0-rc1. Use the 'show' config schema instead."

display_builder.islands.block_library:
  type: display_builder.islands
  mapping:
    exclude:
      type: sequence
      sequence:
        type: string
    exclude_id:
      type: string
    show:
      type: string
    preview:
      type: boolean

display_builder.islands.preset_library:
  type: display_builder.islands
  mapping:
    preview:
      type: boolean

display_builder.islands.collaboration:
  type: display_builder.islands
  mapping:
    image_field:
      type: machine_name
    image_style:
      type: machine_name

display_builder.islands.viewport:
  type: display_builder.islands
  mapping:
    exclude:
      type: sequence
      sequence:
        type: string

display_builder.islands.back:
  type: display_builder.islands
  mapping:
    back:
      type: display_builder.toolbar.button

display_builder.islands.scaffold:
  type: display_builder.islands
  mapping:
    components:
      type: string
      label: 'Component IDs to render'

display_builder.pattern_preset.*:
  type: config_entity
  label: Display builder Preset
  mapping:
    uuid:
      type: uuid
    id:
      type: machine_name
      label: ID
    weight:
      type: weight
      label: Weight
    label:
      type: label
      label: Label
    description:
      type: text
      label: Description
    group:
      type: string
      label: Group
    sources:
      label: 'UI Patterns sources'
      type: sequence
      sequence:
        type: ignore

ui_patterns_slot_source.third_party_setting.styles:
  label: 'UI Styles settings'
  type: mapping
  mapping:
    styles:
      type: ui_styles.selected_mapping

display_builder.panels_display:
  type: string
  label: 'Panels display'
  constraints:
    Choice:
      - label
      - icon
      - icon_label
    FullyValidatable: ~

display_builder.toolbar.button:
  label: 'Label and icon visibility'
  type: mapping
  mapping:
    value:
      type: string
      constraints:
        Choice:
          - label
          - icon
          - icon_label
          - hidden
      FullyValidatable: ~
