display_builder.profile.*:
  type: config_entity
  label: Display builder profile
  mapping:
    id:
      type: machine_name
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: uuid
    description:
      type: text
    library:
      type: string
      label: 'Library type'
    debug:
      type: boolean
      label: 'Debug mode'
    islands:
      type: sequence
      label: 'Islands'
      sequence:
        type: display_builder.island.[%key]
    weight:
      type: weight
      label: Weight

display_builder.island.*:
  type: display_builder.island

display_builder.island:
  type: mapping
  label: 'Island configuration'
  mapping:
    enable:
      type: boolean
      label: Enabled
    weight:
      type: weight
      label: Weight
    region:
      type: machine_name
      label: Region

display_builder.island.history:
  type: display_builder.island
  mapping:
    display_clear_button:
      type: boolean

display_builder.island.component_library:
  type: display_builder.island
  mapping:
    providers:
      type: sequence
      sequence:
        type: string
    status:
      type: sequence
      sequence:
        type: string
    include_no_ui:
      type: boolean
    show_grouped:
      type: boolean
    show_variants:
      type: boolean
    show_mosaic:
      type: boolean

display_builder.island.block_library:
  type: display_builder.island
  mapping:
    providers:
      type: sequence
      sequence:
        type: string

display_builder.island.collaboration:
  type: display_builder.island
  mapping:
    image_field:
      type: machine_name
    image_style:
      type: machine_name

display_builder.island.content_edit:
  type: display_builder.island
  mapping:
    form_mode:
      type: machine_name

display_builder.island.viewport:
  type: display_builder.island
  mapping:
    providers:
      type: sequence
      sequence:
        type: string
    format:
      type: string
      label: Format

display_builder.pattern_preset.*:
  type: config_entity
  label: Display builder Preset
  mapping:
    id:
      type: machine_name
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: uuid
    description:
      type: text
    group:
      type: string
    sources:
      label: 'UI Patterns sources'
      # See Drupal\display_builder\Hook\UiPatternsHooks::schemaInfoAlter().
      type: ui_patterns_slot_source

ui_patterns_slot_source.third_party_setting.ui_styles:
  label: 'UI Styles settings'
  type: mapping
  mapping:
    styles:
      type: ui_styles.selected_mapping
