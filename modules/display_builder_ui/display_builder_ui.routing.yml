# Profile config entity routes
entity.display_builder_profile.collection:
  path: '/admin/structure/display-builder'
  defaults:
    _entity_list: 'display_builder_profile'
    _title: 'Display Builder'
  requirements:
    _permission: 'administer display builder profile'

entity.display_builder_profile.add_form:
  path: '/admin/structure/display-builder/add'
  defaults:
    _entity_form: 'display_builder_profile.add'
    _title: 'Add a Display Builder profile'
  requirements:
    _permission: 'administer display builder profile'

entity.display_builder_profile.edit_form:
  path: '/admin/structure/display-builder/{display_builder_profile}'
  defaults:
    _entity_form: 'display_builder_profile.edit'
    _title: 'Edit a Display Builder profile'
  requirements:
    _permission: 'administer display builder profile'

entity.display_builder_profile.delete_form:
  path: '/admin/structure/display-builder/{display_builder_profile}/delete'
  defaults:
    _entity_form: 'display_builder_profile.delete'
    _title: 'Delete a Display Builder profile'
  requirements:
    _permission: 'administer display builder profile'

# Preset config entity routes
entity.pattern_preset.collection:
  path: '/admin/structure/display-builder/preset'
  defaults:
    _entity_list: 'pattern_preset'
    _title: 'Pattern presets'
  requirements:
    _permission: 'administer pattern preset'

entity.pattern_preset.add_form:
  path: '/admin/structure/display-builder/preset/add'
  defaults:
    _entity_form: 'pattern_preset.add'
    _title: 'Add a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'

entity.pattern_preset.edit_form:
  path: '/admin/structure/display-builder/preset/{pattern_preset}'
  defaults:
    _entity_form: 'pattern_preset.edit'
    _title: 'Edit a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'

entity.pattern_preset.delete_form:
  path: '/admin/structure/display-builder/preset/{pattern_preset}/delete'
  defaults:
    _entity_form: 'pattern_preset.delete'
    _title: 'Delete a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'

# Instances route
entity.display_builder_instance.collection:
  path: '/admin/structure/display-builder/instances'
  defaults:
    _entity_list: 'display_builder_instance'
    _title: 'Display Builder instances'
  requirements:
    _permission: 'view display builder instance'
