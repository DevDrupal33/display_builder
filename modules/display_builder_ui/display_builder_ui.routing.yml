  defaults:
    _entity_form: 'pattern_preset.add'
    _title: 'Add a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'

entity.pattern_preset.edit_form:
  path: '/admin/structure/display-builder/preset/{pattern_preset}'
  defaults:
    _entity_form: 'pattern_preset.edit'
    _title: 'Edit a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'

entity.pattern_preset.delete_form:
  path: '/admin/structure/display-builder/preset/{pattern_preset}/delete'
  defaults:
    _entity_form: 'pattern_preset.delete'
    _title: 'Delete a Pattern preset'
  requirements:
    _permission: 'administer pattern preset'
