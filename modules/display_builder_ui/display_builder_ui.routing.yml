entity.display_builder.collection:
  path: '/admin/structure/display-builder'
  defaults:
    _entity_list: 'display_builder'
    _title: 'Display builders'
  requirements:
    _permission: 'administer display builders'
  options:
    _admin_route: true

entity.display_builder.add_form:
  path: '/admin/structure/display-builder/add'
  defaults:
    _entity_form: 'display_builder.add'
    _title: 'Add display builder'
  requirements:
    _permission: 'administer display builders'
  options:
    _admin_route: true

entity.display_builder.edit_form:
  path: '/admin/structure/display-builder/{display_builder}'
  defaults:
    _entity_form: 'display_builder.edit'
    _title: 'Edit a display builder'
  requirements:
    _permission: 'administer display builders'
  options:
    _admin_route: true

entity.display_builder.delete_form:
  path: '/admin/structure/display-builder/{display_builder}/delete'
  defaults:
    _entity_form: 'display_builder.delete'
    _title: 'Delete a display builder'
  requirements:
    _permission: 'administer display builders'
  options:
    _admin_route: true

entity.pattern_preset.collection:
