display_builder_page_layout.page_layout.*:
  type: config_entity
  label: Page layout
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: string
    weight:
      type: weight
      label: Weight
    conditions:
      type: sequence
      label: 'Conditions'
      sequence:
        type: condition.plugin.[id]
        label: 'Condition'
    display_builder:
      label: "Display Builder profile"
      type: string
      constraints:
        ConfigExists:
          prefix: 'display_builder.display_builder.'
    sources:
      label: "UI Patterns sources"
      type: sequence
      sequence:
        type: ui_patterns_source.[source_id]
  constraints:
    FullyValidatable: ~
