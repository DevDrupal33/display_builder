entity.page_layout.collection:
  path: '/admin/structure/page-layout'
  defaults:
    _entity_list: 'page_layout'
    _title: 'Page layouts'
  requirements:
    _permission: 'administer page_layout'

entity.page_layout.add_form:
  path: '/admin/structure/page-layout/add'
  defaults:
    _entity_form: 'page_layout.add'
    _title: 'Add a page layout'
  requirements:
    _permission: 'administer page_layout'

entity.page_layout.edit_form:
  path: '/admin/structure/page-layout/{page_layout}'
  defaults:
    _entity_form: 'page_layout.edit'
    _title: 'Edit a page layout'
  requirements:
    _permission: 'administer page_layout'

entity.page_layout.display_builder:
  path: '/admin/structure/page-layout/{page_layout}/builder'
  defaults:
    _controller: '\Drupal\display_builder_page_layout\Controller\PageLayoutController::getBuilder'
    _title_callback: '\Drupal\display_builder_page_layout\Controller\PageLayoutController::getTitle'
  requirements:
    _permission: 'administer page_layout'
  options:
    parameters:
      page_layout:
        type: 'entity:page_layout'
    _admin_route: false
    _display_builder_route: true

entity.page_layout.delete_form:
  path: '/admin/structure/page-layout/{page_layout}/delete'
  defaults:
    _entity_form: 'page_layout.delete'
    _title: 'Delete a page layout'
  requirements:
    _permission: 'administer page_layout'
# Defines a new route for duplicating an existing page layout.  
# This route directs to the 'duplicate' method in the PageLayoutController class,
# which handles the duplication logic and displays the entity form for the new,
# duplicated page layout.
entity.page_layout.duplicate_form:
  path: '/admin/structure/page-layout/{page_layout}/duplicate'
  defaults:
    _controller: '\Drupal\display_builder_page_layout\Controller\PageLayoutController::duplicate'
    _title: 'Duplicate page layout'
  requirements:
    _permission: 'administer page_layout'
