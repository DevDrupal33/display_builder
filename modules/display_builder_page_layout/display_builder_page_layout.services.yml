services:
  display_builder_page_layout.page_variant_subscriber:
    class: Drupal\display_builder_page_layout\EventSubscriber\PageVariantSubscriber
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  display_builder_page_layout.display_builder_subscriber:
    class: Drupal\display_builder_page_layout\EventSubscriber\DisplayBuilderSubscriber
    arguments:
      - '@plugin.cache_clearer'
      - '@entity_type.manager'
      - '@plugin.manager.display_buildable'
    tags:
      - { name: 'event_subscriber' }

  display_builder_page_layout.builder_data_converter:
    class: Drupal\display_builder_page_layout\BuilderDataConverter
    arguments:
      - '@block.repository'
      - '@theme.manager'
      - '@theme.initialization'
      - '@config.factory'
