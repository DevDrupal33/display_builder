services:
  display_builder_entity_view.routes:
    class: Drupal\display_builder_entity_view\Routing\DisplayBuilderRoutes
    arguments:
      - '@entity_type.manager'
      - '@module_handler'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.overrides_routes:
    class: Drupal\display_builder_entity_view\Routing\OverridesRoutes
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.display_builder_subscriber:
    class: Drupal\display_builder_entity_view\EventSubscriber\DisplayBuilderSubscriber
    arguments:
      - '@display_builder.state_manager'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.field.display_builder_item_list:
    class: Drupal\display_builder_entity_view\Field\DisplayBuilderItemList
    arguments:
      - '@plugin.manager.ui_patterns_source'
      - '@display_builder.state_manager'
      - '@entity_type.manager'
