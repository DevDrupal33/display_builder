services:
  display_builder_entity_view.routes:
    class: Drupal\display_builder_entity_view\Routing\DisplayBuilderRoutes
    arguments:
      - '@entity_type.manager'
      - '@module_handler'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.overrides_routes:
    class: Drupal\display_builder_entity_view\Routing\OverridesRoutes
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.display_builder_subscriber:
    class: Drupal\display_builder_entity_view\EventSubscriber\DisplayBuilderSubscriber
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  display_builder_entity_view.builder_data_converter:
    class: Drupal\display_builder_entity_view\BuilderDataConverter
    arguments:
      - '@entity_field.manager'

  Drupal\display_builder_entity_view\Hook\DisplayBuilderEntityViewHooks:
    class: Drupal\display_builder_entity_view\Hook\DisplayBuilderEntityViewHooks
    autowire: true
