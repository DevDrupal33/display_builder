services:
  _defaults:
    autowire: true

  display_builder.htmx_events:
    class: Drupal\display_builder\HtmxEvents
    arguments: []

  plugin.manager.db_island:
    class: Drupal\display_builder\IslandPluginManager
    parent: default_plugin_manager
  Drupal\display_builder\IslandPluginManagerInterface: '@plugin.manager.db_island'

  display_builder.slot_sources_proxy:
    class: Drupal\display_builder\SlotSourceProxy
    arguments:
      - '@plugin.manager.ui_patterns_source'

  display_builder.config_form_builder:
    class: Drupal\display_builder\ConfigFormBuilder
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@module_handler'
  Drupal\display_builder\ConfigFormBuilderInterface: '@display_builder.config_form_builder'

  display_builder.event_subscriber:
    class: '\Drupal\display_builder\Event\DisplayBuilderEventsSubscriber'
    arguments:
      - '@plugin.manager.db_island'
      - '@entity_type.manager'
    tags:
      - { name: 'event_subscriber' }

  display_builder.theme_negotiator:
    class: Drupal\display_builder\Theme\DisplayBuilderThemeNegotiator
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
    tags:
      - { name: theme_negotiator, priority: 100 }

  display_builder.preview_theme_negotiator:
    class: Drupal\display_builder\Theme\PreviewThemeNegotiator
    arguments:
      - '@config.factory'
    tags:
      - { name: theme_negotiator, priority: 200 }

  display_builder.access_check.subrequest:
    class: Drupal\display_builder\Access\SubrequestAccessCheck
    tags:
      - { name: access_check, applies_to: _access_display_builder_subrequest }
