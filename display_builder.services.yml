services:
  display_builder.htmx_events:
    class: Drupal\display_builder\HtmxEvents
    arguments: []

  plugin.manager.db_island:
    class: Drupal\display_builder\Island\IslandPluginManager
    parent: default_plugin_manager
  Drupal\display_builder\Island\IslandPluginManagerInterface: '@plugin.manager.db_island'

  display_builder.summary_collector:
    class: Drupal\display_builder\SummaryCollector
    arguments:
      - '@plugin.manager.db_island'

  display_builder.slot_sources_proxy:
    class: Drupal\display_builder\SlotSourceProxy
    arguments:
      - '@plugin.manager.ui_patterns_source'

  display_builder.event_subscriber:
    class: '\Drupal\display_builder\Event\DisplayBuilderEventsSubscriber'
    arguments:
      - '@plugin.manager.db_island'
    tags:
      - { name: 'event_subscriber' }

  display_builder.page_variant_subscriber:
    class: Drupal\display_builder\Event\PageVariantSubscriber
    tags:
      - { name: event_subscriber }

  display_builder.deny_preview_sub_request:
    class: Drupal\display_builder\PageCache\DenyPreviewSubRequest
    tags:
      - { name: dynamic_page_cache_request_policy }

  display_builder.preview_render_cache:
    class: Drupal\display_builder\Render\PreviewRenderCache
    decorates: render_cache
    arguments: ['@.inner', '@request_stack']

  plugin.manager.display_buildable:
    class: Drupal\display_builder\DisplayBuildablePluginManager
    parent: default_plugin_manager
  Drupal\display_builder\DisplayBuildablePluginManager: '@plugin.manager.display_buildable'
