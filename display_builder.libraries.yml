htmx_sse:
  remote: https://htmx.org/extensions/sse/
  version: 2.2.3
  license:
    name: BSD Zero Clause License
    gpl-compatible: true
  dependencies:
    # @see \Drupal\display_builder\Hook\LibrariesSwitcher
    - display_builder/_htmx_sse_cdn

_htmx_sse_cdn:
  js:
    https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.3/dist/sse.min.js:
      type: external
      minified: true

_htmx_sse_local:
  js:
    /libraries/htmx-ext-sse/node_modules/htmx-ext-sse/dist/sse.min.js:
      minified: true

shoelace:
  remote: https://shoelace.style/
  version: 2.20.1
  license:
    name: MIT
    url: https://github.com/shoelace-style/shoelace/blob/next/LICENSE.md
    gpl-compatible: true
  dependencies:
    # @see \Drupal\display_builder\Hook\LibrariesSwitcher
    - display_builder/_shoelace_cdn

# Only to be loaded as a display_builder/shoelace dependency.
# The default value for Web users.
_shoelace_cdn:
  css:
    theme:
      https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.min.css:
        type: external
        minified: true
      https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.min.css:
        type: external
        minified: true
  js:
    # https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace.min.js:
    https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.min.js:
      type: external
      minified: true
      attributes:
        type: module

# Only to be loaded as a display_builder/shoelace dependency.
# The default value for pipeline jobs.
_shoelace_local:
  css:
    theme:
      /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/themes/light.css:
        {}
      /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/themes/dark.css:
        {}
  js:
    /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/shoelace.js:
      attributes:
        type: module

db_drawer:
  css:
    component:
      ./assets/css/db_drawer.css: {}
  js:
    ./assets/js/db_drawer.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/drupal.displace

search:
