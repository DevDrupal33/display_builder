htmx_sse:
  remote: https://htmx.org/extensions/sse/
  version: 2.2.3
  license:
    name: BSD Zero Clause License
    gpl-compatible: true
  dependencies:
    # @see \Drupal\display_builder\Hook\LibrariesSwitcher
    - display_builder/_htmx_sse_cdn

_htmx_sse_cdn:
  js:
    https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.3/dist/sse.min.js:
      type: external
      minified: true
      attributes:
        # integrity: 'sha384-Y4gc0CK6Kg+hmulDc6rZPJu0tqvk7EWlih0Oh+2OkAi1ZDlCbBDCQEE2uVk472Ky'
        crossorigin: anonymous

_htmx_sse_local:
  js:
    /libraries/htmx-ext-sse/node_modules/htmx-ext-sse/dist/sse.min.js:
      minified: true

shoelace:
  remote: https://shoelace.style/
  version: 2.20.1
  license:
    name: MIT
    url: https://github.com/shoelace-style/shoelace/blob/next/LICENSE.md
    gpl-compatible: true
  dependencies:
    # @see \Drupal\display_builder\Hook\LibrariesSwitcher
    - display_builder/_shoelace_cdn

# Only to be loaded as a display_builder/shoelace dependency.
# The default value for Web users.
_shoelace_cdn:
  css:
    theme:
      https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.min.css:
        type: external
        minified: true
        attributes:
          # integrity: 'sha384-M+C/2jSkTP7YSiPPehDdTw83rJI29ijSR9ZAvsmXyloKVFMtxpKOBZMD/vqL/m3t'
          crossorigin: anonymous
      https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.min.css:
        type: external
        minified: true
        attributes:
          # integrity: 'sha384-NT+VSt72u+fz0PfYmxREk1vAZB7V7C/MTR0h20VbKyyppnaL3/+sL2ATPJL1ps51'
          crossorigin: anonymous
  js:
    # https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace.min.js:
    https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.min.js:
      type: external
      minified: true
      attributes:
        type: module
        # integrity: 'sha384-2K6qlhxAuwXHTOJvMkVXpHnJcPHhlM2FXXLXJE2qkR6igDl8IrXI6gM670/KfoQ2'
        crossorigin: anonymous

# Only to be loaded as a display_builder/shoelace dependency.
# The default value for pipeline jobs.
_shoelace_local:
  css:
    theme:
      /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/themes/light.css:
        {}
      /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/themes/dark.css:
        {}
  js:
    /libraries/shoelace/node_modules/@shoelace-style/shoelace/cdn/shoelace.js:
      attributes:
        type: module

# Local storage utility class.
local_storage_manager:
  js:
    ./assets/js/localStorageManager.js: {}

viewport_switcher:
  css:
    component:
      ./assets/css/viewport_switcher.css: {}
  js:
    ./assets/js/viewport_switcher.js: {}

# The Preview island's placeholder markers. Attached by the island itself, and
# only when it actually emitted one, because this has to load inside the
# live-preview iframe - a document with none of the builder's own CSS.
# @see \Drupal\display_builder\Plugin\display_builder\Island\PreviewPanel::renderPreviewSources()
preview_placeholder:
  css:
    component:
      ./assets/css/preview_placeholder.css: {}

highlight:
  js:
    ./assets/js/highlight.js: {}
  dependencies:
    - core/once
    - display_builder/local_storage_manager

expand:
  js:
    ./assets/js/expand.js: {}

# Standalone CKEditor 5, hand-attached to a plain #type => 'textarea' -
# never core's #type => 'text_format' / editor.module Drupal.editors
# integration. @see assets/js/textarea_ckeditor.js
textarea_ckeditor:
  js:
    ./assets/js/textarea_ckeditor.js: {}
  dependencies:
    - core/once
    - core/ckeditor5
    - core/ckeditor5.editorClassic
    - core/ckeditor5.essentials
    - core/ckeditor5.basic
    - core/ckeditor5.heading
    - core/ckeditor5.link
    - core/ckeditor5.list
    - core/ckeditor5.blockquote
    - core/ckeditor5.htmlSupport
    - core/ckeditor5.sourceEditing
    - core/ckeditor5.showBlocks

instances:
  css:
    component:
      ./assets/css/instances.css: {}
  js:
    ./assets/js/instances.js: {}
  dependencies:
    - core/drupal
    - core/once

# Global fixes meant to disappear or replaced by a cleaner solution.
# The per-admin-chrome files are split by which module they target, for
# readability only - both load unconditionally, since every selector in them is
# scoped to that module's own unique element ID and so matches nothing at all on
# a site not running it.
_fix:
  css:
    theme:
      ./assets/css/_fix.css: {}
      # Classic Toolbar module, and Admin Toolbar contrib on top of it.
      ./assets/css/_fix_toolbar.css: {}
      # Navigation module.
      ./assets/css/_fix_navigation.css: {}
