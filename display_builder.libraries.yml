    ./assets/js/fullscreen.js: {}

# Custom fixes for CKEditor and Wysiwyg.
_fix_wysiwyg:
  js:
    ./assets/js/_fix_wysiwyg.js: {}

# Global fixes meant to disappear or replaced by a cleaner solution.
_fix:
  css:
    theme:
      ./assets/css/_fix.css: {}

navigation:
  css:
    theme:
      assets/css/navigation.css: {}
