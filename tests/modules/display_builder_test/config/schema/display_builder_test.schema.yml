display_builder.islands.test_island_view:
  type: mapping
  mapping:
    status:
      type: boolean
      label: Enabled
    weight:
      type: weight
      label: Weight
    string_value:
      type: string
    bool_value:
      type: integer
    # A pair of interchangeable keys, so a config migration test has somewhere
    # to move a value to. @see \Drupal\display_builder\Update\ProfileIslandsUpdater
    legacy_setting:
      type: string
    setting:
      type: string
    string_array:
      type: mapping
      mapping:
        foo:
          type: string
        bar:
          type: string
        baz:
          type: string
