- table:
  - rowgroup:
    - row "Step Published Time User Message":
      - columnheader "Step"
      - columnheader "Published"
      - columnheader "Time"
      - columnheader "User"
      - columnheader "Message"
  - rowgroup:
    - row /-5 \d+:\d+ Import from Block Layout configuration\./:
      - cell "-5"
      - cell
      - cell /\d+:\d+/
      - cell
      - cell "Import from Block Layout configuration."
    - row /-4 \d+:\d+ admin Page layout \(from active theme\) has been removed from root/:
      - cell "-4"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - cell "Page layout (from active theme) has been removed from root":
        - emphasis: Page layout (from active theme)
        - text: ""
        - emphasis: root
    - row /-3 \d+:\d+ admin Test simple component has been attached to root/:
      - cell "-3"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - cell "Test simple component has been attached to root":
        - emphasis: Test simple
        - text: ""
    - row /-2 \d+:\d+ admin Textfield textfield has been attached to Test simple's slot_1/:
      - cell "-2"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - cell "Textfield textfield has been attached to Test simple's slot_1":
        - emphasis: Textfield
        - text: ""
        - emphasis: Test simple
        - text: ""
    - 'row /-1 \d+:\d+ admin Textfield: Test 1 has been updated/':
      - cell "-1"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - 'cell "Textfield: Test 1 has been updated"':
        - emphasis: "Textfield: Test 1"
        - text: ""
    - row /0 \d+:\d+ admin Test simple component has been attached to root/:
      - cell "0"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - cell "Test simple component has been attached to root":
        - emphasis: Test simple
        - text: ""
    - row /1 \d+:\d+ admin Textfield textfield has been attached to Test simple's slot_1/:
      - cell "1"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - cell "Textfield textfield has been attached to Test simple's slot_1":
        - emphasis: Textfield
        - text: ""
        - emphasis: Test simple
        - text: ""
    - 'row /2 \d+:\d+ admin Textfield: Test 2 has been updated/':
      - cell "2"
      - cell
      - cell /\d+:\d+/
      - cell "admin"
      - 'cell "Textfield: Test 2 has been updated"':
        - emphasis: "Textfield: Test 2"
        - text: ""