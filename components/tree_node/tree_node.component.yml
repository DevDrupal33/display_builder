name: Tree node
description: A collapsible row in the Display Builder tree panel, showing an icon, a title, and optional nested children.
noUi: true
group: Display builder
slots:
  title:
    title: Title
  children:
    title: Children
props:
  type: object
  properties:
    icon:
      title: Icon name
      type: string
    expanded:
      title: Expanded
      type: boolean
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - display_builder/shoelace
