name: HTML Tag
description: Allow inclusion of self closing HTML tag. Should only be void elements.
status: experimental
group: Other
links:
  - https://developer.mozilla.org/en-US/docs/Glossary/Void_element
props:
  type: object
  properties:
    tag:
      title: Tag
      description: HTML tag, only letters and dash allowed.
      type: string
      pattern: '^[a-zA-Z0-9-]+$'
