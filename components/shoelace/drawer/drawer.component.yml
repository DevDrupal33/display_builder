name: Shoelace Drawers
description: Drawers slide in from a container to expose additional options and information.
links:
  - https://shoelace.style/components/drawer
slots:
  content:
    title: Content
props:
  type: object
  properties:
    id:
      title: Id
      type: string
    label:
      title: Label
      type: string
    size:
      title: Size
      type: string
    placement:
      title: Placement
      type: string
      default: end
      enum:
        - top
        - end
        - bottom
        - start
    contained:
      title: Contained
      type: boolean
      default: false
    no_header:
      title: FRemoves the header
      type: boolean
      default: false
    footer_close:
      title: Footer close
      type: boolean
      default: true
    close_variant:
      title: Footer close variant
      type: string
      default: primary
      enum:
        - default
        - primary
        - success
        - neutral
        - warning
        - danger
