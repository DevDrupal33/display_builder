name: Menu Item
noUi: true
group: Navigation
description: Menu items provide options for the user to pick from in a menu.
links:
  - https://shoelace.style/components/menu-item
variants:
  default:
    title: Default
  divider:
    title: Divider
slots:
  title:
    title: Title
  submenu:
    title: Sub menu
props:
  type: object
  properties:
    value:
      title: Value
      type: string
    icon:
      title: Icon name
      type: string
    icon_position:
      title: Icon position
      type: string
      enum:
        - prefix
        - suffix
      default: prefix
    disabled:
      title: Disabled
      type: boolean
