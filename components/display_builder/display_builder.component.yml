name: Display builder
noUi: true
group: Display builder
slots:
  view_sidebar:
    title: View sidebar
  view_main:
    title: View main
  contextual_islands:
    title: Contextual islands
  menu_islands:
    title: Menu islands
props:
  type: object
  properties:
    builder_id:
      title: HTML ID
      $ref: ui-patterns://identifier
libraryOverrides:
  dependencies:
    - core/drupal
    - core/drupal.displace
    - core/once
    - display_builder/_fix
    - display_builder/contextual_menu
    - display_builder/db_drawer
    - display_builder/form
    - display_builder/form_description
    - display_builder/keyboard
    - display_builder/local_storage_manager
    - display_builder/preview
    - display_builder/search
    - core/drupal.htmx
    # Introduced by navigation module, internal but we can rely on it for now.
    - core/internal.floating-ui
    # Seems require to avoid a bug on ajax. see #3547315
    - core/internal.jquery.form
