name: Display builder
noUi: true
group: Display builder
slots:
  view_sidebar_buttons:
    title: View sidebar buttons
  view_sidebar:
    title: View sidebar
  view_main_tabs:
    title: View main tabs
  view_main:
    title: View main
  view_floating_controls:
    title: View floating controls
  start_buttons:
    title: Action buttons (start)
  end_buttons:
    title: Action buttons (end)
  contextual_islands:
    title: Contextual islands
  menu_islands:
    title: Menu islands
props:
  type: object
  properties:
    builder_id:
      title: HTML ID
      $ref: ui-patterns://identifier
    buildable_id:
      title: HTML ID
      $ref: ui-patterns://identifier
libraryOverrides:
  js:
    js/display_builder.js: {}
    js/deferred_islands.js: {}
    js/sidebar.js: {}
    js/preview.js: {}
    js/live_preview.js: {}
    js/split.js: {}
    js/keyboard.js: {}
    js/form.js: {}
  css:
    component:
      css/variables.css: {}
      css/colors.css: {}
      css/move.css: {}
      css/display_builder.css: {}
      css/sidebar.css: {}
      css/preview.css: {}
    theme:
      css/form.css: {}
  dependencies:
    - core/drupal
    - core/drupal.displace
    - core/once
    - display_builder/_fix
    - display_builder/local_storage_manager
    - core/drupal.htmx
    # Introduced by navigation module, internal but we can rely on it for now.
    - core/internal.floating-ui
    # Seems require to avoid a bug on ajax. see #3547315
    - core/internal.jquery.form
