name: Default
props:
  size: '16px'
library_wrapper: >
  {% set sizes = [
    '8px',
    '16px',
    '24px',
    '32px',
    '40px',
    '48px',
    '56px',
    '64px',
    '72px',
    '80px',
    '88px',
    '96px',
    '104px',
    '112px',
    '120px',
    '128px',
    '136px',
    '144px',
    '152px',
    '160px',
  ] %}
  <style>
    ._story_spacer_highlight { outline: 1px dashed blue; margin: 1rem; padding: 1rem; }
  </style>
  {% for direction in ['vertical', 'horizontal', 'both'] %}
    {% for size in sizes %}
      {% set app_props = {'#props': _story['#props']|merge({
          'size': size,
          'direction': direction,
          'attributes': {
            'class': '_story_spacer_highlight'
          },
        })}
      %}
      {% set app_story = _story %}
      <div style="margin: 0 auto;">
      {{ 'Size @size, direction: @dir'|t({ '@size': size, '@dir': direction }) }}{{ app_story|merge(app_props) }}
      </div>
    {% endfor %}
  {% endfor %}
