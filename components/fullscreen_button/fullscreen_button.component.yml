name: Fullscreen Button
description: Display builder specific button to handle fullscreen.
noUi: true
group: Display builder
props:
  type: object
  properties:
    id:
      title: HTML ID
      $ref: ui-patterns://identifier
    label:
      title: Label
      type: string
    title:
      title: Title
      type: string
    keyboard:
      title: Keyboard shortcut
      type: string
    icon:
      title: Icon name
      type: string
    tooltip:
      title: Tooltip content, can contain HTML
      type: string
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - display_builder/local-storage-manager
