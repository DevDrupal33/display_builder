# Attach a component_id, a block_id, or an node_id to the root.
display_builder.api_root_attach:
  path: '/api/display-builder/{builder}'
  methods: [POST]
  defaults:
    _controller: '\Drupal\display_builder\Controller\ApiController::attachToRoot'
  requirements:
    _permission: 'access display builder'
  options:
    _htmx_route: true
    parameters:
      builder:
        type: 'entity:display_builder_instance'

# Attach a component_id, a block_id, or an node_id to a slot.
display_builder.api_slot_attach:
  path: '/api/display-builder/{builder}/node/{node_id}/{slot}'
  methods: [POST]
  defaults:
    _controller: '\Drupal\display_builder\Controller\ApiController::attachToSlot'
  requirements:
    _permission: 'access display builder'
  options:
    _htmx_route: true
    parameters:
      builder:
        type: 'entity:display_builder_instance'

